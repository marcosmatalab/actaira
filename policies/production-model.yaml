# The policy this repository ships as a starting point, not as a standard.
#
# Design note D-114. A tool that ships one policy and calls it "the" policy is
# making a decision that belongs to whoever owns the system. What this file is
# for is to be copied, argued with in a pull request, and versioned by the
# team that owns the pipeline. Every rule below states what it is actually
# protecting, because a rule nobody can explain is a rule that gets deleted
# the first time it is inconvenient.
#
#   actaira policy check model.pt --policy policies/production-model.yaml

policy: production-model
version: 1
description: >-
  What this repository considers safe to load in a production process.

rules:
  - id: no-high-severity-findings
    effect: deny
    description: >-
      A high or critical finding is a mechanism, not a warning: an import the
      allowlist refuses, a member escaping the extraction root, an archive that
      expands without bound. None of them are style.
    when:
      finding_severity_at_least: high

  - id: execution-surface-read-end-to-end
    effect: require
    description: >-
      The claim that matters. A PASS over a partially read execution surface
      says the scanner did not finish, not that the artifact is clean, and the
      two have to be distinguishable in a pipeline.
    when:
      coverage:
        surface: load_time_execution
        at_least: complete

  - id: no-process-or-network-callables
    effect: deny
    description: >-
      Prefix match, so os. covers os.system and os.popen. An allowlist that had
      to enumerate every dangerous callable would be out of date the day it was
      written; this is the backstop under it.
    when:
      imports_callable:
        - os.
        - posix.
        - subprocess.
        - socket.
        - builtins.eval
        - builtins.exec
        - builtins.__import__

  - id: review-anything-whose-format-is-unknown
    effect: review
    description: >-
      Not a denial. A format this tool does not read is a file it cannot speak
      about, and the honest response is a person, not a verdict.
    when:
      detected_format: unknown

  - id: signed-by-a-key-this-environment-trusts
    effect: require
    description: >-
      Two separate conditions on purpose. A signature that verifies says the
      bytes were not altered; it says nothing about whether the key belongs to
      anyone you trust, and conflating the two is the oldest mistake in
      supply-chain tooling. Runs with no attestation at all come back REVIEW,
      not ALLOW.
    when:
      signature_verified: true
      signer_trusted: true
