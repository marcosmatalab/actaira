[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actaira"
version = "3.0.0"
description = "Capture what an AI agent did from outside it, decide deterministically whether it left what it declared, and emit a record a third party verifies without trusting the operator. Nothing is ever scored."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Marcos Mata Garcia" }]
keywords = [
  "ai-agents", "agent-security", "llm-security", "mcp", "attestation",
  "transparency-log", "conformance", "agent-observability", "agentic-ai",
  "ai-assurance", "policy-as-code", "provenance", "ed25519", "audit-trail",
]
classifiers = [
  # Back to Beta, and deliberately. 5 described the scanner, which is archived;
  # what is here is the evidence core plus two commands, and a stable label on
  # a product mid-pivot is a claim about a surface that does not exist yet.
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# One runtime dependency, on purpose. A tool that inspects supply chains
# should not have a supply chain of its own. Everything else is stdlib.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# `jsonschema` is a test dependency only: `tests/test_schemas.py` validates
# every emitted document against the contract it declares. It never enters the
# runtime dependency set - the tool still installs with `cryptography` alone.
# Pillow and numpy went with the model scanner: nothing in this tree reads an
# image or a tensor any more.
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18"]
# `mypy` is its own extra and not part of `dev`, deliberately. `make all` is
# the gate this release is closed against, and it must not be able to go red
# because a third-party checker changed what it reports between two versions.
# `make types` is the ratchet (D-242, scripts/type_check.py): it holds the
# modules that already pass, and refuses a stale entry on the known-unclean
# list as loudly as it refuses a new error.
types = ["mypy>=1.11"]
# `build` is here for `make package` and, like the two above, not in `dev`: a
# packaging tool must not be able to break an install of the package.
package = ["build>=1.2"]

[project.scripts]
actaira = "actaira.cli:main"
# The MCP server is a second entry point rather than a ninth subcommand:
# CLAUDE.md caps `actaira` at eight commands, and a server is not a command
# anybody types. This is the string that goes in somebody's .mcp.json.
actaira-mcp = "actaira.mcp:main"

# Two entries, and only the two that exist. The block used to say there was
# no repository and no issue tracker, which was true of a local snapshot and
# stopped being true when this became a public project - so it was a false
# statement in package metadata, readable by every tool that reads metadata
# and checkable by none of them. That is the same failure in the other
# direction, which is why `Documentation` and `Homepage` are still absent:
# there is no documentation site and no home page, the docs are in the tree
# beside this file, and a metadata field pointing at a URL that 404s is worse
# than one that is not there.
[project.urls]
Repository = "https://github.com/marcosmatalab/actaira"
Issues = "https://github.com/marcosmatalab/actaira/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actaira = ["i18n/*.json", "schemas/*.json", "trace/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# S314: tests/test_junit.py parses the XML this repository wrote three lines
# earlier, to assert on it. Reaching for defusedxml would add a dependency in
# order to defend the test suite against its own output.
# S311: `random.Random(seed)` in test_state.py generates the digraphs the
# cycle walk is differentially tested against. The whole point is that a
# failing seed reproduces from the command line, which a cryptographic
# source would make impossible. Nothing there is a secret.
"tests/*" = ["S301", "S603", "S108", "S314", "S310", "S311"]
# S105: `PASS = "pass"` is an enum member for a verdict, not a credential.
# UP042: str+Enum is kept over StrEnum so the module stays readable on 3.11
# without a version-gated import; the .value semantics are identical.
"src/actaira/model.py" = ["S105", "UP042"]
# UP042, the same decision again. `Surface` and `CoverageState` are compared
# with `is`, serialised with `.value` and read back from JSON by third-party
# verifiers, exactly like `Verdict`. The coverage matrix is signed into an
# attestation, so how these enums serialise is part of a public contract, and
# it should be spelt the way every other enum in this repository is spelt.
"src/actaira/coverage.py" = ["UP042"]
"src/actaira/policy/model.py" = ["UP042"]
# UP042 once more. `Effect` is serialised into the A-BOM with `.value` and
# read back from it, so its spelling is part of a document contract, and it
# should look like every other enum in this repository.
"src/actaira/conformance/model.py" = ["UP042"]
"src/actaira/conformance/vocabulary.py" = ["UP042", "S105"]
"src/actaira/subject.py" = ["UP042"]
"src/actaira/state/evidence.py" = ["UP042", "S105"]
"src/actaira/state/graph.py" = ["UP042"]
"src/actaira/state/watch.py" = ["UP042"]
"src/actaira/conformance/paths.py" = ["UP042", "S105"]
# N818: `Unevaluable` keeps its name, on the same argument the predicates keep theirs. The rule exists so an unfamiliar exception is recognisable as one
# at the call site, and this one is: it is raised by the predicates in
# engine.py, caught by name at exactly one place, and named in the design note
# that explains why a predicate with no information must not return False.
# `UnevaluableError` would read as a failure of the engine rather than what it
# is, a statement about the run.
"src/actaira/policy/engine.py" = ["N818"]
# N818 again: `NetworkRefused` is raised by the suite's network guard and
# caught by name in exactly one place, `tests/test_netguard.py`. The rule
# exists so an unfamiliar exception reads as one at the call site, and this
# one does; `NetworkRefusedError` would read as a failure of the guard rather
# than what it is, a statement about the test that tripped it.
"tests/netguard.py" = ["N818"]
# S112: a malformed key in a package keyring must not abort verification. The
# loop tries the next key and, if none verifies, the caller gets an explicit
# "signature does not verify" problem rather than a stack trace.
"src/actaira/attest/verify.py" = ["S112"]
# UP042 again, and for the same reason as every other enum here: both of
# these serialise with `.value` into `trace/v1`, which is a published
# contract a third party reads back. How they spell is part of it.
"src/actaira/trace/__init__.py" = ["UP042"]
"src/actaira/trace/model.py" = ["UP042"]
# UP042 once more. `Writer` and `Travel` are compared with `is` and read with
# `.value` exactly like the rest, and the provenance table is meant to read
# like the contracts it classifies rather than like an exception to them.
"src/actaira/trace/provenance.py" = ["UP042"]
