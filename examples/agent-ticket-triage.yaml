# An agent declaration, written to be argued with in a pull request.
#
# This one is deliberately a realistic bad example. Every tool on it is
# defensible alone and the combination is the incident: it reads ticket
# comments written by anyone, it can comment and merge without approval, and
# it holds a credential that can reach the secret store while another tool can
# reach the network. `actaira agent check` names all three.
#
#   actaira agent check examples/agent-ticket-triage.yaml

agent: ticket-triage
version: "4"
model: anthropic/claude-sonnet-4-5
environment: production
owner: platform@example.com

tools:
  - name: read_ticket_comments
    description: Fetches the comment thread of a ticket, including from external reporters.
    effects:
      - read
      - untrusted_input
    scopes:
      - jira

  - name: post_comment
    description: Replies on the ticket.
    effects:
      - write
      - send
    scopes:
      - jira

  - name: merge_pull_request
    description: Merges an approved pull request.
    effects:
      - write
    scopes:
      - github

  - name: fetch_url
    description: Retrieves a URL referenced in a ticket.
    effects:
      - network
      - read
      - untrusted_input

  - name: read_deploy_key
    description: Reads the deployment credential so it can be passed to the pipeline.
    effects:
      - secrets
      - read

mcp_servers:
  - name: jira
    reference: ghcr.io/example/mcp-jira:latest
    transport: stdio

  - name: github
    reference: ghcr.io/example/mcp-github@sha256:2b3a4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b
    publisher: example-platform
    digest: sha256:2b3a4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b

identities:
  - name: triage-bot
    kind: service_account
    scopes:
      - jira:write
      - github:write

data_sources:
  - name: jira
    classification: internal
    access: read_write
    trusted: false
  - name: github
    classification: internal
    access: read_write
    trusted: true
