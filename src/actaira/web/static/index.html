            <p class="step-card__text" data-i18n="welcome.step3.text"></p>
          </div>
        </li>
      </ol>

      <!-- A worked example of step 2, rendered by the same component that
           renders the real thing, and labelled as an example. -->
      <figure class="demo" id="demo-trace"></figure>
    </div>

    <div class="dropzone" id="dz-inspect" data-target="inspect">
      <svg class="icon dropzone__icon" aria-hidden="true"><use href="#i-upload"></use></svg>
      <p class="dropzone__title" data-i18n="drop.title">Drop an artifact here</p>
      <p class="dropzone__hint" data-i18n="drop.hint">or</p>
      <input type="file" id="file-inspect" class="visually-hidden" tabindex="-1">
      <button type="button" class="btn btn--primary" data-i18n="drop.choose">Choose a file</button>
      <p class="dropzone__formats" data-i18n="drop.formats"></p>
      <p class="dropzone__file" id="chosen-inspect" hidden></p>
    </div>

    <!-- Sample artifacts, filled in from /api/samples. Hidden when the
         installation has no corpus on disk. -->
    <div class="samples" id="samples-inspect" hidden>
      <div class="samples__head">
        <svg class="icon" aria-hidden="true"><use href="#i-flask"></use></svg>
        <span class="samples__label" data-i18n="samples.title"></span>
        <span class="samples__note" data-i18n="samples.note"></span>
      </div>
      <div class="samples__grid" id="samples-grid-inspect"></div>
    </div>

    <details class="options" id="options-inspect">
      <summary data-i18n="options.title">Scan options</summary>
      <div class="options__grid">
        <p class="field">
          <label class="field__label" for="policy-inspect" data-i18n="options.policy">Import policy</label>
          <select class="field__control" id="policy-inspect">
            <option value="strict" data-i18n="options.policy.strict">strict, allowlist</option>
            <option value="known-bad" data-i18n="options.policy.known_bad">known-bad, denylist</option>
          </select>
          <span class="field__help" data-i18n="options.policy.help"></span>
        </p>
        <p class="field">
          <label class="field__label" for="failon-inspect" data-i18n="options.fail_on">Fail on</label>
          <select class="field__control" id="failon-inspect">
            <option value="critical">critical</option>
            <option value="high" selected>high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
          </select>
          <span class="field__help" data-i18n="options.fail_on.help"></span>
        </p>
      </div>
    </details>

    <div class="results" id="out-inspect" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Agents ──────────────────────────────────────────────────────────
       One dropzone, and everything below it drawn by app.js: the capability
       findings, one SVG per attack route, the A-BOM download and the diff
       against a second declaration. Same rule as every other panel: nodes are
       created with createElement and filled with textContent, so nothing a
       declaration contains can become markup. -->
  <section class="panel" id="panel-agents" role="tabpanel" aria-labelledby="tab-agents" hidden>
    <p class="panel__lede" data-i18n="agents.lede"></p>

    <div class="dropzone" id="dz-agents" data-target="agents">
      <svg class="icon dropzone__icon" aria-hidden="true"><use href="#i-upload"></use></svg>
      <p class="dropzone__title" data-i18n="agents.drop_title">Drop an agent declaration</p>
      <p class="dropzone__hint" data-i18n="drop.hint">or</p>
      <input type="file" id="file-agents" class="visually-hidden" tabindex="-1" accept=".yaml,.yml,.json">
      <button type="button" class="btn btn--primary" data-i18n="agents.choose">Choose a .yaml</button>
      <p class="dropzone__formats" data-i18n="agents.hint"></p>
      <p class="dropzone__file" id="chosen-agents" hidden></p>
    </div>

    <div class="results" id="out-agents" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Policy ──────────────────────────────────────────────────────────
       The document first, then a decision about one subject under it. Both
       halves are drawn by app.js: the rules are a list of whatever the
       document declares, and the proof is one row per rule per subject. -->
  <section class="panel" id="panel-policy" role="tabpanel" aria-labelledby="tab-policy" hidden>
    <p class="panel__lede" data-i18n="policy.lede"></p>

    <div class="dropzone" id="dz-policy" data-target="policy">
      <svg class="icon dropzone__icon" aria-hidden="true"><use href="#i-upload"></use></svg>
      <p class="dropzone__title" data-i18n="policy.drop_title">Drop a policy document</p>
      <p class="dropzone__hint" data-i18n="drop.hint">or</p>
      <input type="file" id="file-policy" class="visually-hidden" tabindex="-1" accept=".yaml,.yml">
      <button type="button" class="btn btn--primary" data-i18n="policy.choose">Choose a .yaml</button>
      <p class="dropzone__formats" data-i18n="policy.hint"></p>
      <p class="dropzone__file" id="chosen-policy" hidden></p>
    </div>

    <div class="results" id="out-policy" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Graph ───────────────────────────────────────────────────────────
       The workspace, not a file. Built entirely by app.js because everything
       in it depends on what the store holds, and because every string that
       reaches it - an asset id, a source URI, the name of whoever stated a
       relation - is written with textContent. This panel is the one that
       draws text somebody else put in a database, so the rule that nothing
       is ever assigned to innerHTML is doing real work here. -->
  <section class="panel" id="panel-graph" role="tabpanel" aria-labelledby="tab-graph" hidden>
    <p class="panel__lede" data-i18n="gr.lede"></p>
    <div class="results" id="out-graph" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Evidence ────────────────────────────────────────────────────── -->
  <!-- A reader over the ledger and nothing else. The Store can revoke, trust
       and delete a record; none of that is here, because each has security
       semantics that deserve their own review rather than a button added
       because the method existed. -->
  <section class="panel" id="panel-evidence" role="tabpanel" aria-labelledby="tab-evidence" hidden>
    <p class="panel__lede" data-i18n="ev.lede"></p>
    <div class="results" id="out-evidence" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Changes ─────────────────────────────────────────────────────── -->
  <section class="panel" id="panel-changes" role="tabpanel" aria-labelledby="tab-changes" hidden>
    <p class="panel__lede" data-i18n="ch.lede"></p>
    <div class="results" id="out-changes" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Attest ──────────────────────────────────────────────────────── -->
  <section class="panel" id="panel-attest" role="tabpanel" aria-labelledby="tab-attest" hidden>
    <p class="panel__lede" data-i18n="attest.lede"></p>

    <div class="dropzone" id="dz-attest" data-target="attest">
      <svg class="icon dropzone__icon" aria-hidden="true"><use href="#i-upload"></use></svg>
      <p class="dropzone__title" data-i18n="drop.title">Drop an artifact here</p>
      <p class="dropzone__hint" data-i18n="drop.hint">or</p>
      <input type="file" id="file-attest" class="visually-hidden" tabindex="-1">
      <button type="button" class="btn btn--primary" data-i18n="drop.choose">Choose a file</button>
      <p class="dropzone__formats" data-i18n="attest.hint"></p>
      <p class="dropzone__file" id="chosen-attest" hidden></p>
    </div>

    <details class="options" id="options-attest">
      <summary data-i18n="options.title">Scan options</summary>
      <div class="options__grid">
        <p class="field">
          <label class="field__label" for="policy-attest" data-i18n="options.policy">Import policy</label>
          <select class="field__control" id="policy-attest">
            <option value="strict" data-i18n="options.policy.strict">strict, allowlist</option>
            <option value="known-bad" data-i18n="options.policy.known_bad">known-bad, denylist</option>
          </select>
        </p>
        <p class="field">
          <label class="field__label" for="failon-attest" data-i18n="options.fail_on">Fail on</label>
          <select class="field__control" id="failon-attest">
            <option value="critical">critical</option>
            <option value="high" selected>high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
          </select>
        </p>
      </div>
    </details>

    <div class="results" id="out-attest" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Verify ──────────────────────────────────────────────────────── -->
  <section class="panel" id="panel-verify" role="tabpanel" aria-labelledby="tab-verify" hidden>
    <p class="panel__lede" data-i18n="verify.lede"></p>

    <div class="dropzone" id="dz-verify" data-target="verify">
      <svg class="icon dropzone__icon" aria-hidden="true"><use href="#i-upload"></use></svg>
      <p class="dropzone__title" data-i18n="verify.drop_title">Drop an attestation package</p>
      <p class="dropzone__hint" data-i18n="drop.hint">or</p>
      <input type="file" id="file-verify" class="visually-hidden" tabindex="-1" accept=".zip,application/zip">
      <button type="button" class="btn btn--primary" data-i18n="verify.choose">Choose a .zip</button>
      <p class="dropzone__formats" data-i18n="verify.hint"></p>
      <p class="dropzone__file" id="chosen-verify" hidden></p>
    </div>

    <div class="results" id="out-verify" aria-live="polite" aria-busy="false"></div>
  </section>

  <!-- ── Governance ──────────────────────────────────────────────────────
       Built by app.js so it follows the language switch like everything
       else: the notice, the controls, the timeline of application dates
       with today marked, the dropzone and one card per obligation. Every
       node is created with createElement and filled with textContent, so
       the strict CSP holds and no text from a report can become markup. -->
  <section class="panel" id="panel-govern" role="tabpanel" aria-labelledby="tab-govern" hidden>
    <div class="gov" id="gov-body"></div>
  </section>

</main>

<footer class="footer">
  <div class="shell footer__row">
    <div class="footer__brand">
      <svg class="brand-mark brand-mark--sm" aria-hidden="true"><use href="#i-mark"></use></svg>
      <span class="footer__name">actaira</span>
    </div>
    <div class="footer__notes">
      <p class="footer__note" data-i18n="footer.never_executes"></p>
      <p class="footer__note footer__note--dim" data-i18n="footer.deps"></p>
    </div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/app.js" defer></script>
</body>
</html>
