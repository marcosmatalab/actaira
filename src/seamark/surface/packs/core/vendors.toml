#  The core rule pack for the vendors phase S2 added: VS Code, devcontainer,
#  Codex CLI, Cursor, Gemini CLI, and the instruction files several of them read.
#
#  Same contract as `claude-code.toml`, and the same three prohibitions. No rule
#  here says what a configuration would DO. None answers False about a fact
#  nobody observed - the clauses name the facts, and a capability that does not
#  carry one comes back INDETERMINATE on its own (D-275). And `severity` is the
#  label this pack's author chose: it is published beside this author's name and
#  is never summed, maximised or compared with another pack's.
#
#  Every rule below has a REAL violating case from a public repository with an
#  OSI licence, found by `scripts/surface_corpus.py` and promoted into
#  `tests/fixtures/surface/corpus/` with its repo, commit, licence and blob sha.
#  None is marked NO REAL VIOLATION. The three that were marked in phase S1 stay
#  in `claude-code.toml` with their evidence.
#
#  One rule per STATEMENT, not one per key. ACT-S022 covers two Codex keys
#  because they make one statement - a guardrail that would have contained or
#  asked is switched off - and two identifiers for one statement would break
#  `docs/COMPATIBILITY.md`'s promise that an identifier means one thing forever.

[pack]
name = "core"
author = "Seamark core"
version = "1"

# ---------------------------------------------------------------------------
# VS Code: the half of both 2026 worms that phase S1 could name and not read
# ---------------------------------------------------------------------------

#  `runOn: folderOpen` is the mechanism the keyv wave used alongside the Claude
#  Code hook, so that either half on its own was enough. The rule reports the
#  DECLARATION; whether it runs is the capability's resolution, printed beside
#  the finding, and it is INDETERMINATE whenever no scope this run read said
#  what `task.allowAutomaticTasks` is. That is the whole of D-282 and it is why
#  `requires = DECLARED`: a rule that waited for EFFECTIVE would report nothing
#  in the pull-request case, which is the case this command exists for.
[[rule]]
id = "ACT-S016"
version = "1"
vendor = "vscode"
requires = "DECLARED"
severity = "high"
capability = ["task.command"]
remediation = "Remove `runOptions.runOn: folderOpen`, or move the work into a task somebody runs on purpose. Opening the folder is not a decision to run this."
atr = ["ATR-T1546"]
references = [
  "https://code.visualstudio.com/docs/debugtest/tasks",
  "https://www.stepsecurity.io/blog/a-mini-shai-hulud-has-appeared",
  "https://snyk.io/blog/inside-keyv-npm-compromise-preinstall-malware-trusted-provenance-ide-hooks/",
]
[[rule.when]]
fact = "at_startup"
op = "is_true"

# ---------------------------------------------------------------------------
# devcontainer: the one lifecycle command that is not contained
# ---------------------------------------------------------------------------

#  Five of the six lifecycle commands run inside the container. This one runs on
#  the host, before any container exists, so the containment that is the whole
#  point of a dev container is not there yet. Legitimate uses exist; the rule
#  says where it runs and what it points at, and the reader decides.
[[rule]]
id = "ACT-S017"
version = "1"
vendor = "devcontainer"
requires = "DECLARED"
severity = "high"
capability = ["lifecycle.command"]
remediation = "This command runs on the host, not in the container. If it only needs to happen inside, move it to onCreateCommand or postCreateCommand."
references = ["https://containers.dev/implementors/json_reference/"]
[[rule.when]]
fact = "on_host"
op = "is_true"

#  A mount whose source is a credential directory hands the agent inside the
#  container the developer's keys, for the life of the container and without a
#  prompt. The reader never opens the directory: it reports that the
#  configuration names it.
[[rule]]
id = "ACT-S018"
version = "1"
vendor = "devcontainer"
requires = "DECLARED"
severity = "critical"
capability = ["container.mount"]
remediation = "This mount gives the container the developer's credentials. Mount a narrower path, or use a credential helper that does not put the private key inside the container."
atr = ["ATR-T1552"]
references = ["https://containers.dev/implementors/json_reference/"]
[[rule.when]]
fact = "names_credential"
op = "is_true"

#  `privileged`, an added capability or a security option each remove part of
#  what a container is for. One statement, three spellings, one identifier.
[[rule]]
id = "ACT-S019"
version = "1"
vendor = "devcontainer"
requires = "DECLARED"
severity = "high"
capability = ["container.isolation"]
remediation = "This weakens the container boundary. Drop privileged, capAdd or securityOpt unless the container genuinely needs it, and say in the file why if it does."
references = ["https://containers.dev/implementors/json_reference/"]
[[rule.when]]
fact = "isolation_weakened"
op = "is_true"

#  A Feature with no version resolves to whatever is published when the
#  container is built, which is the same mechanism as an unpinned `npx`.
[[rule]]
id = "ACT-S020"
version = "1"
vendor = "devcontainer"
requires = "DECLARED"
severity = "medium"
capability = ["container.feature"]
remediation = "Pin the Feature to a version. Without one, the build fetches whatever the registry serves at the moment it runs."
atr = ["ATR-T1195"]
references = ["https://containers.dev/implementors/json_reference/"]
[[rule.when]]
fact = "pinned"
op = "is_false"

# ---------------------------------------------------------------------------
# Codex CLI
# ---------------------------------------------------------------------------

#  The same argument as ACT-S001 in the other pack, for a different vendor's
#  file: starting a session is not a decision to run code. Codex differs in one
#  way that the capability's resolution carries rather than this rule - the
#  project `.codex/` layer loads only when the project is trusted, so this comes
#  back DECLARED until a trust_level is read.
[[rule]]
id = "ACT-S021"
version = "1"
vendor = "codex"
requires = "DECLARED"
severity = "high"
capability = ["hook.command"]
remediation = "Remove the hook, or move it to ~/.codex/config.toml where it is yours rather than the repository's. A hook on a session event runs without anybody asking for it."
atr = ["ATR-T1546"]
references = ["https://learn.chatgpt.com/docs/config-file/config-advanced"]
[[rule.when]]
fact = "at_startup"
op = "is_true"

#  `sandbox_mode = "danger-full-access"` and `approval_policy = "never"` are two
#  keys making one statement: the guardrail that would have contained the run or
#  asked before it is off. Both capabilities carry `guardrail_removed`, so one
#  identifier covers the statement and neither key gets an id of its own.
[[rule]]
id = "ACT-S022"
version = "1"
vendor = "codex"
requires = "DECLARED"
severity = "critical"
capability = ["sandbox.mode", "approval.policy"]
remediation = "A repository file turns off the sandbox or stops Codex asking. Use read-only or workspace-write, and on-request, and set the exception where you can see it rather than in the repository."
atr = ["ATR-T1562"]
references = ["https://learn.chatgpt.com/docs/config-file/config-reference"]
[[rule.when]]
fact = "guardrail_removed"
op = "is_true"

#  An unpinned launcher fetches whatever the registry serves at the moment the
#  server starts, which is how both 2026 worms reached a machine to begin with.
[[rule]]
id = "ACT-S023"
version = "1"
vendor = "codex"
requires = "DECLARED"
severity = "high"
capability = ["mcp.server"]
remediation = "Pin the version. An unpinned npx or uvx launch fetches whatever the registry serves at the moment the server starts."
atr = ["ATR-T1195"]
references = ["https://learn.chatgpt.com/docs/config-file/config-reference"]
[[rule.when]]
fact = "pinned"
op = "is_false"

# ---------------------------------------------------------------------------
# Cursor
# ---------------------------------------------------------------------------

#  `sessionStart` and `workspaceOpen`. The second has no equivalent in the other
#  vendors' hook lists: it fires when the workspace opens, which is the VS Code
#  `folderOpen` shape arriving through a different vendor's file.
[[rule]]
id = "ACT-S024"
version = "1"
vendor = "cursor"
requires = "DECLARED"
severity = "high"
capability = ["hook.command"]
remediation = "Remove the hook, or move it to ~/.cursor/hooks.json. A hook on sessionStart or workspaceOpen runs before anybody has read the repository."
atr = ["ATR-T1546"]
references = ["https://cursor.com/docs/agent/hooks"]
[[rule.when]]
fact = "at_startup"
op = "is_true"

[[rule]]
id = "ACT-S025"
version = "1"
vendor = "cursor"
requires = "DECLARED"
severity = "high"
capability = ["mcp.server"]
remediation = "Pin the version in .cursor/mcp.json. An unpinned launch fetches whatever the registry serves when the server starts."
atr = ["ATR-T1195"]
references = ["https://cursor.com/docs/context/mcp"]
[[rule.when]]
fact = "pinned"
op = "is_false"

# ---------------------------------------------------------------------------
# Gemini CLI
# ---------------------------------------------------------------------------

[[rule]]
id = "ACT-S026"
version = "1"
vendor = "gemini-cli"
requires = "DECLARED"
severity = "high"
capability = ["mcp.server"]
remediation = "Pin the version in .gemini/settings.json. An unpinned launch fetches whatever the registry serves when the server starts."
atr = ["ATR-T1195"]
references = ["https://geminicli.com/docs/reference/configuration/"]
[[rule.when]]
fact = "pinned"
op = "is_false"

#  One boolean in a project file removes every confirmation for one server's
#  tools, in the vendor's own words. Worth naming on its own because it is not
#  a weakening of a sandbox or a permission list - it is a per-server exemption
#  from the prompt, and it is easy to commit without noticing.
[[rule]]
id = "ACT-S027"
version = "1"
vendor = "gemini-cli"
requires = "DECLARED"
severity = "high"
capability = ["mcp.server"]
remediation = "Remove `trust: true` from this server, or set it in your own ~/.gemini/settings.json. It bypasses every tool call confirmation for that server."
atr = ["ATR-T1562"]
references = ["https://geminicli.com/docs/reference/configuration/"]
[[rule.when]]
fact = "trusted_by_config"
op = "is_true"

#  `general.defaultApprovalMode = "auto_edit"` auto-approves edit tools, and in
#  Gemini CLI a PROJECT settings file overrides the user's - which is the
#  opposite of Claude Code's ladder and the reason this cannot be read as "the
#  developer chose it". A repository can choose it for them.
#
#  `plan` is deliberately not a violation. The reference calls it read-only
#  mode, so it is a tightening, and a rule that fired on it would report a
#  repository for restricting its own agent. The fact is computed in the
#  resolver rather than listed here, so the pack cannot disagree with it.
[[rule]]
id = "ACT-S031"
version = "1"
vendor = "gemini-cli"
requires = "DECLARED"
severity = "high"
capability = ["approval.policy"]
remediation = "Remove the approval mode from the repository file, or set it in your own ~/.gemini/settings.json. In Gemini CLI a project settings file overrides the user's, so this chooses for everyone who clones the repository."
atr = ["ATR-T1562"]
references = ["https://geminicli.com/docs/reference/configuration/"]
[[rule.when]]
fact = "guardrail_removed"
op = "is_true"

# ---------------------------------------------------------------------------
# Instruction files: structure and literals, never intention
# ---------------------------------------------------------------------------
#
#  These three are the whole of what phase S2 will say about AGENTS.md,
#  CLAUDE.md and GEMINI.md. Each is a statement about a PATH or a LITERAL
#  STRING, and none is a statement about what the text means. There is no list
#  of suspicious phrases here and there will not be one: classifying intention
#  is the second negative, and a phrase list is a list somebody rewords.
#  `test_surface_instructions` puts "ignore all previous instructions" in a
#  fixture and asserts that nothing fires.

#  An import whose path resolves outside the repository pulls a file the
#  repository does not contain into every session's context. Claude Code gates
#  it behind a one-time approval dialog, which the capability's `condition`
#  carries; the rule reports that the repository asks for it.
[[rule]]
id = "ACT-S028"
version = "1"
vendor = "instructions"
requires = "DECLARED"
severity = "medium"
capability = ["instructions.import"]
remediation = "This import resolves outside the repository, so what it loads is not in the tree you reviewed. Move the file into the repository, or keep the instruction in your own user-scope memory file."
references = ["https://code.claude.com/docs/en/memory"]
[[rule.when]]
fact = "outside_tree"
op = "is_true"

#  A line that contains, literally, a download piped into an interpreter. The
#  rule names the capability - the file contains this string - and says nothing
#  about why it is there or what it would do.
[[rule]]
id = "ACT-S029"
version = "1"
vendor = "instructions"
requires = "DECLARED"
severity = "medium"
capability = ["instructions.remote_execution"]
remediation = "This line tells whoever reads it - a person or a model - to fetch a remote script and run it unread. Pin the artifact and verify it before running, or install from a package the repository already depends on."
atr = ["ATR-T1105"]
references = ["https://code.claude.com/docs/en/memory"]
[[rule.when]]
fact = "literal_remote_execution"
op = "is_true"

#  An instruction file that names a script by path gets the same four facts a
#  hook's target gets, and for the same reason: the approval is over the
#  digest, never over the name, because the file at that path can change after
#  you read it (published limit 14).
[[rule]]
id = "ACT-S030"
version = "1"
vendor = "instructions"
requires = "DECLARED"
severity = "medium"
capability = ["instructions.import"]
remediation = "The instructions name a script by path. Tie your approval to its sha256 rather than its path: the file at that path can change after you read it."
references = ["https://code.claude.com/docs/en/memory"]
[[rule.when]]
fact = "is_script"
op = "is_true"
