# A composite action rather than a Docker action, for one reason: a Docker
# action builds or pulls an image on every run, and this tool is a few hundred
# kilobytes of Python with one dependency. `pip install` from the action's own
# checkout is faster and, more importantly, it pins the tool to the tag the
# workflow asked for, so `@v3.0.0` scans with Actaira 3.0.0 and nothing else.
name: "Actaira scan"
description: "Static inspection of ML model artifacts. Emits SARIF for code scanning and fails the job on the severity you choose. Nothing is ever loaded or executed."
author: "Marcos Mata Garcia"

branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "File or directory to scan, relative to the workspace."
    required: false
    default: "."
  policy:
    description: "Import policy: strict (allowlist, the default) or known-bad (denylist)."
    required: false
    default: "strict"
  fail-on:
    description: "Lowest severity that fails an artifact: critical, high, medium or low."
    required: false
    default: "high"
  allow-inconclusive:
    description: "Treat an artifact that could not be fully read as success, collapsing exit code 3 into 0. Off by default: an unread artifact is not a safe one."
    required: false
    default: "false"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning. The job needs permissions: security-events: write."
    required: false
    default: "true"
  sarif-file:
    description: "Path the SARIF report is written to, relative to the workspace."
    required: false
    default: "actaira.sarif"
  sarif-category:
    description: "Code scanning category, so several Actaira runs in one repository do not overwrite each other."
    required: false
    default: "actaira"
  python-version:
    description: "Python used to run Actaira."
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: "The Actaira exit code: 0 clean, 1 a failure, 2 usage, 3 inconclusive."
    value: ${{ steps.scan.outputs.exit-code }}
  verdict:
    description: "pass, fail, inconclusive or usage."
    value: ${{ steps.scan.outputs.verdict }}
  sarif-file:
    description: "Path of the SARIF report that was written."
    value: ${{ steps.scan.outputs.sarif-file }}
  summary:
    description: "The one-line count: artifacts scanned, passed, failed, inconclusive."
    value: ${{ steps.scan.outputs.summary }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install actaira from this action's checkout
      shell: bash
      env:
        ACTAIRA_ROOT: ${{ github.action_path }}/../../..
      run: python -m pip install --disable-pip-version-check --no-cache-dir "$ACTAIRA_ROOT"

    # Every input reaches the script as an environment variable. Interpolating
    # ${{ inputs.x }} into a run block would paste an attacker-controlled string
    # into a shell command, which is the standard GitHub Actions injection.
    - name: Scan
      id: scan
      shell: bash
      env:
        ACTAIRA_PATH: ${{ inputs.path }}
        ACTAIRA_POLICY: ${{ inputs.policy }}
        ACTAIRA_FAIL_ON: ${{ inputs.fail-on }}
        ACTAIRA_ALLOW_INCONCLUSIVE: ${{ inputs.allow-inconclusive }}
        ACTAIRA_SARIF_FILE: ${{ inputs.sarif-file }}
      run: "${{ github.action_path }}/entrypoint.sh"

    # Runs even when the scan found something, because the alerts are the
    # reason the scan ran. The job still fails afterwards, in the step below.
    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-written == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ inputs.sarif-category }}

    - name: Fail the job on the Actaira exit code
      if: ${{ steps.scan.outputs.should-fail == 'true' }}
      shell: bash
      env:
        ACTAIRA_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        ACTAIRA_SUMMARY: ${{ steps.scan.outputs.summary }}
      run: |
        echo "::error title=Actaira::${ACTAIRA_SUMMARY} (exit code ${ACTAIRA_EXIT_CODE})"
        exit "${ACTAIRA_EXIT_CODE}"
