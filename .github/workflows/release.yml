# The distributions are built here and nowhere else, and they carry a
# statement of where they came from.
#
# WHY THIS FILE EXISTS, when `ci.yml` says in its own comments that a release
# job is deliberately absent. That comment was about a workflow that DECIDES to
# publish, and it still holds: nothing here starts by itself. A person creates
# the release, which is the deliberate act, and what follows is a machine doing
# the part a person cannot: signing a statement that these exact bytes were
# built from this exact commit by this exact workflow.
#
# A laptop cannot produce that statement. `actions/attest-build-provenance`
# signs a SLSA provenance predicate with a certificate minted for this
# repository's OIDC identity, and the signature is only worth anything because
# the identity belongs to the runner rather than to whoever is typing. So the
# build moved off the laptop, and `.github/release-notes/RUNBOOK.md` changed
# with it: the person tags, writes the release, and reads the result.
#
# It is the same argument as the `dogfood` job in `ci.yml`. A repository about
# supply chains that published an unsigned wheel with no provenance, from a
# personal machine, would be the thing a hostile reader looks for first.
#
# ON PINNING. Every action is pinned to a commit SHA with the tag it resolved
# from beside it. Resolved on 2026-09-22 with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# dereferencing the tag object where the ref is an annotated tag, because
# `uses:` takes a commit and an annotated tag's sha is the tag object. The
# checkout and setup-python pins are the ones `ci.yml` already carries.
name: release

on:
  # The release exists before this runs: a person wrote it and pressed the
  # button. What this adds is the attested build, attached to that release.
  # Nothing is uploaded to a package index: the tool installs from its tag, and
  # `scripts/release_check.py` refuses a workflow that uploads (design note D-306).
  release:
    types: [published]

# Nothing by default. Every job asks for what it needs and no more.
permissions: {}

# One release at a time, and never cancelled: `cancel-in-progress` on the job
# that attaches the assets would mean stopping between two files.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: build on a runner, and attest what the bytes were built from
    runs-on: ubuntu-latest
    permissions:
      # Read the tree, mint an OIDC token to prove which workflow this is, and
      # write the attestation that says so. No write to the repository itself:
      # this job produces bytes and a statement about them, nothing else.
      contents: read  # check the tree out
      id-token: write  # mint the OIDC identity the attestation is signed against
      attestations: write  # write that attestation to this repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: build the distributions with the same target a laptop runs
        # `make package` and not `python -m build`: one definition of how this
        # package is built, which `scripts/release_check.py` refuses to let
        # come apart. The target cleans dist/ first and asserts what went into
        # both artifacts.
        run: |
          set -euo pipefail
          python -m pip install build twine
          make package
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: what these bytes were built from
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          # The wheel and the sdist. NOT `dist/SHA256SUMS`: attesting a list of
          # checksums says nothing that attesting the files themselves does not
          # already say, and it invites a reader to verify the wrong thing.
          subject-path: "dist/*.whl,dist/*.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  attach:
    name: attach the attested distributions to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # Write, because attaching an asset to a release is a write to the
      # repository. It is the only job here that has one.
      contents: write  # attaching an asset to a release is a write to the repository
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: dist
          path: dist
      - name: upload them to the release a person wrote
        # `--clobber` so that re-running this job replaces the assets instead
        # of failing halfway.
        #
        # The tag goes through `env:` and is quoted in the command. A tag name
        # is somebody else's string the moment this repository has more than
        # one person with push access, and a `${{ }}` pasted into a shell is
        # the class of defect this repository tells other people to care about.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber --repo "$REPOSITORY"
