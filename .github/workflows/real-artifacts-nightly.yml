# The gap the 2.2 plan called P0-06, closed.
#
# `tests/test_real_artifacts.py` guards every case with `importorskip`, and it
# has to: a project whose central claim is "you can inspect an artifact without
# installing the ecosystem that loads it" cannot have a test suite that needs
# torch. But a guard that keeps the suite green on a bare machine also keeps it
# green when the ML stack is present and the tests were never run - and this is
# exactly the area where a parser can drift away from a real format without the
# synthetic corpus noticing, because the synthetic corpus is written by this
# repository and agrees with itself by construction.
#
# So: one scheduled job that installs the stack and then refuses to pass if any
# of those tests skipped. `-rs` prints the skip reasons and the
# step below reads them, because a nightly whose whole value is "these ran"
# must fail when they did not, rather than reporting 40 passed and 12 skipped
# in green.
name: real-artifacts-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "evals/corpus/real.py"
      - "tests/test_real_artifacts.py"
      - "src/actaira/formats/**"
      - ".github/workflows/real-artifacts-nightly.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  real-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: install the tool and the stack it deliberately does not depend on
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx h5py safetensors

      - name: every library the cases need is importable
        run: |
          python - <<'PY'
          # importlib.util is a submodule: `import importlib` alone does not bind it,
          # and this heredoc runs before anything else has imported it for us.
          import importlib.util
          import sys
          missing = [name for name in ("torch", "onnx", "h5py", "safetensors")
                     if importlib.util.find_spec(name) is None]
          if missing:
              sys.exit(f"not installed: {', '.join(missing)}. This job exists to run with them.")
          print("torch, onnx, h5py, safetensors all importable")
          PY

      - name: generate the corpus with the real serialisers
        run: make real-corpus

      - name: every case this suite pins was actually generated
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "tests")
          from test_real_artifacts import REQUIRED_LIBRARIES

          built = {
              case["name"]
              for case in json.loads(pathlib.Path("evals/real/real_cases.json").read_text())
          }
          missing = sorted(set(REQUIRED_LIBRARIES) - built)
          if missing:
              sys.exit("generators produced nothing for: " + ", ".join(missing))
          print(f"{len(built)} artifacts generated by the real serialisers")
          PY

      # The step that makes the job worth scheduling. A skip here is not a
      # neutral outcome: it means the nightly installed the stack, ran, and
      # checked nothing. ACTAIRA_REQUIRE_REAL_STACK turns every guard in that
      # file into a failure that names the missing library, which is a real
      # assertion rather than a grep over a log.
      - name: real-artifact tests, with skipping disallowed
        env:
          ACTAIRA_REQUIRE_REAL_STACK: "1"
        run: python -m pytest tests/test_real_artifacts.py -rs -o addopts= | tee real-artifacts.log

      - name: the run reports no skips at all
        run: |
          python - <<'PY'
          import pathlib, re, sys
          log = pathlib.Path("real-artifacts.log").read_text()
          skipped = re.findall(r"^SKIPPED \[\d+\] (.+)$", log, re.M)
          if skipped:
              sys.exit("this job exists so these run. Skipped:\n  " + "\n  ".join(skipped))
          summary = re.search(r"^=+ (.*(?:passed|failed).*) =+$", log, re.M)
          print(summary.group(1) if summary else "no skips")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-artifacts-${{ matrix.python-version }}
          path: |
            real-artifacts.log
            evals/real/real_cases.json
          retention-days: 14
