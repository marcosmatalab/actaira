# Every gate this project claims, as a workflow definition. The rule from the
# Makefile applies: NO STEP IS ALLOWED A `|| true`. A step that cannot fail is
# not a check, and a workflow full of them is a green tick with nothing behind
# it.
#
# WHAT THIS FILE IS. The integration definition, and it does run: the tree has
# a remote and these jobs execute on every push to `main` and every pull
# request. It is still not the whole gate. `make all` is what a change is held
# against on a laptop, and `make release-check` is the one that refuses a tree
# whose parts disagree with each other.
#
# WHAT WENT IN PHASE A.1, AND WHY. Five of the eight jobs here ran commands and
# directories that do not exist:
#
#   eval        `evals/` went to tag v2.3.0 at 3.0.0.
#   fuzz        `fuzz/` went with it, and `make fuzz` is not a Makefile target.
#   benchmark   installed picklescan, modelscan and fickling to compare against
#               a scanner this tree does not contain.
#   attest-self `seamark attest` does not parse. Neither does `--continue`.
#   figures     consumed the artifacts the eval and benchmark jobs uploaded.
#
# A workflow that names a command the tool does not have fails on its first run
# in a fork, and this one had not been run since the pivot. A CI definition
# nobody executes is documentation, and this repository has just spent a phase
# removing documentation that described a product that is not here.
#
# So this is the jobs that correspond to something: lint over the three
# directories that exist, the suite on the three interpreters `pyproject.toml`
# claims to support, an installability check that builds the distributions and
# runs the tool out of a clean environment, and the two phase S3 added - `zizmor`
# over this file and `action.yml`, and a test of the published Action that uses
# it the way a stranger would.
#
# WHAT IS DELIBERATELY NOT HERE. A `release` job. Publishing is a deliberate
# act, and a workflow that performs it on a tag push is the opposite of
# deliberate. The version agreement it used to check is checked by
# `scripts/release_check.py`, which runs on a laptop and needs no tag.
#
# `.github/workflows/release.yml` arrived later and does not contradict that,
# which is worth saying because it looks as though it might. It does not fire
# on a tag: it fires when a PERSON publishes a release, and what it adds is the
# one thing a laptop cannot produce - a signed statement that these exact bytes
# were built from this exact commit by this exact workflow. The deliberate act
# stayed with the person; the part that needs an identity nobody can borrow
# moved to the runner.
#
# `make release-check` and `make figures` ARE here now, in the `consistency`
# job, and the thing that changed to allow it is in `scripts/figures.py`. They
# were excluded because both re-measure the working tree and `figures.py`
# rewrote a wall clock and the current HEAD on every run, so the comparison a
# runner could make was between two machines and always came out different.
# The stamp is carried over when nothing was measured differently, so the file
# is a function of the tree, and `git diff --exit-code` after it means what it
# says. The best gate this repository has ran on one laptop until then; a fork
# had no net at all.
#
# ON PINNING. Every `actions/*` step is pinned to a COMMIT SHA, with the tag it
# resolved from written beside it. They were pinned to a major tag until phase
# S3, on the argument that a SHA copied from somewhere else is a claim the
# repository cannot check - which was true and stopped being the whole story the
# day this repository started PUBLISHING a GitHub Action. A tool whose own
# workflows float on a mutable tag is not in a position to tell anybody what
# their agents can do, and `zizmor` below says so on every run.
#
# Each SHA was resolved on 2026-09-18 on a machine with network access, with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`, and the
# command is written here so anybody can run it again and disagree. Re-resolving
# is how these are updated; editing the tag comment without re-resolving is the
# failure this note exists to make visible.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A second push supersedes the first rather than queueing
# behind it, which for a gate is the right answer: the only interesting result
# is the one about the head of the branch. `main` is not cancelled, because the
# run that proved a commit green is a record rather than a queue slot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: ruff over the three directories that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        # The three directories that exist. It read `src tests evals fuzz
        # scripts` until phase A.1; ruff exits 2 on a path that is not there,
        # so this job had been failing for its own reasons rather than for the
        # code's.
        run: python -m ruff check src tests scripts

  test:
    name: the suite, on every interpreter pyproject claims
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: tests
        run: python -m pytest tests --cov=src/seamark --cov-report=term
      - name: the coverage floor
        # Measured on all three interpreters, enforced on one. A floor applied
        # per interpreter turns a version-gated branch into a red build on the
        # version that does not take it, which is a failure about Python rather
        # than about this repository. The number is printed by every job, so a
        # drop on 3.11 or 3.13 is visible without being fatal.
        #
        # 88 while the tree measures 90, and the reason is in the Makefile: a
        # floor pegged to the current value goes red the day somebody adds a
        # legitimate defensive branch, and a gate that breaks on its own gets
        # switched off.
        if: matrix.python-version == '3.12'
        run: python -m coverage report --fail-under=88
      - name: the coverage figure the READMEs publish is the one measured here
        # The floor above says the tree may not fall below 88. This says the
        # number both landing pages print is the one this runner measured, and
        # it is here rather than in the consistency job because that job does
        # not run the suite and therefore has no coverage to compare with.
        #
        # The published figure is the integer coverage.py prints, not the
        # float: a percentage to two places would turn one defensive branch
        # into a red build on somebody else's machine, which is a gate going
        # red for a reason that is not a change to this repository.
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          MEASURED="$(python scripts/coverage_figure.py)"
          RECORDED="$(python -c "import json; print(json.load(open('figures.json'))['coverage']['percent'])")"
          echo "this runner measured $MEASURED, figures.json publishes $RECORDED"
          test "$MEASURED" = "$RECORDED"

      - name: openssl is present, so the cross-implementation checks ran
        # `tests/test_chain_and_signing.py` checks this tree's Ed25519 against
        # openssl rather than against itself. If openssl were missing the tests
        # would skip and the job would still be green, so its absence is made
        # an error here instead of a silent hole.
        run: openssl version

  package:
    name: it installs, and the tool runs out of the install
    # "It is installable" is a claim, so it is checked: build the sdist and the
    # wheel, install each into an empty environment that has never seen this
    # checkout, and run the tool from there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: build sdist and wheel, and assert what went into them
        # `make package`, the same target a laptop runs, and that is work rule
        # 10 rather than a preference. This step used to build with
        # `python -m build` and then assert two resource paths of its own
        # further down, while `make package` asserted a different set on a
        # laptop. Two definitions of "the package carries what it needs" do not
        # add up, they cancel: the laptop's list named
        # `seamark/web/static/index.html` and four more files that left with the
        # scanner, so `make package` failed on every run from the pivot onwards
        # and this job stayed green over the same distributions.
        #
        # Calling `scripts/build_package.py` here closed the list and left the
        # COMMAND in two places, which is the same shape one level up: the
        # target could grow a step - a cleaned `dist/`, a signature, a source
        # archive - and CI would go on building the distributions the old way
        # and still be green. `release_check.py` refuses a workflow that builds
        # them any other way.
        run: |
          set -euo pipefail
          python -m pip install build twine
          make package
          python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: install from the sdist and use it
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/from-sdist"
          "$RUNNER_TEMP/from-sdist/bin/python" -m pip install --quiet dist/*.tar.gz
          VERSION="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          REPORTED="$("$RUNNER_TEMP/from-sdist/bin/seamark" --version)"
          echo "pyproject says $VERSION, the installed tool says $REPORTED"
          test "$REPORTED" = "seamark $VERSION"
      - name: the installed package imports, in isolation
        run: |
          set -euo pipefail
          # -I: isolated, so the checkout's own directory is off sys.path and
          # these imports say what is installed rather than what is lying
          # about. `seamark.web` was in this list until phase A.1 and has not
          # existed since 3.0.0, so this step asserted the presence of a module
          # the package does not ship.
          #
          # What is NOT here any more is a hand-written list of resource files.
          # `scripts/build_package.py` reads every non-Python file under
          # `src/seamark/` and asserts it is in the wheel, which is one
          # definition instead of two that can drift apart.
          "$RUNNER_TEMP/from-sdist/bin/python" -I -c "import seamark, seamark.mcp, seamark.attest.timestamp"
      - name: the installed tool runs offline, out of the package
        run: |
          set -euo pipefail
          # `scan --demo` reads a fixture that ships inside the package, so this
          # is the one command that proves an install works with no network, no
          # agent on the machine and nothing from this checkout.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/from-sdist/bin/seamark" scan --demo
      - name: install from the wheel and use it
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/from-wheel"
          "$RUNNER_TEMP/from-wheel/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/from-wheel/bin/seamark" --version
          "$RUNNER_TEMP/from-wheel/bin/seamark" scan --demo

  consistency:
    name: the tree does not disagree with itself
    # `scripts/release_check.py` is the best artifact in this repository and it
    # ran nowhere but one laptop. It compares facts recorded in two places and
    # fails when they have come apart: a figure that drifted from what the code
    # measures, a flag the documentation shows that the command does not have,
    # a claim on the README that the CLI's own parser contradicts.
    #
    # The second step is the other half. `release_check.py` compares the READMEs
    # against `figures.json`; it cannot notice that `figures.json` itself was
    # written against an older tree, because both sides then agree on the same
    # wrong number. Re-measuring and demanding an empty diff is what closes it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
          # `figures.py` counts commits and names HEAD. A shallow clone would
          # make it measure a repository with one commit in it.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: the parts of the tree agree with each other
        run: python scripts/release_check.py
      - name: the commit bodies are the ones the history should carry
        # Here and not in another job because this one already fetches the
        # whole history: `fetch-depth: 0` above is what makes the question
        # answerable at all, and a shallow clone would let it pass by having
        # nothing to read.
        run: python scripts/history_check.py

      - name: the measured figures are the ones committed
        run: |
          set -euo pipefail
          python scripts/figures.py
          python scripts/sync_readme_figures.py
          git diff --exit-code

  dogfood:
    name: this repository runs its own Action on itself and uploads the result
    # README.md told a reader that uploading the SARIF to code scanning was
    # theirs to do, and this repository did not do it. A tool whose own
    # Security tab is empty while it recommends the integration is the thing a
    # hostile reader looks for first, so it does it here, with the published
    # Action and no shortcut.
    #
    # It does not fail on a finding, and that is the fourth negative rather
    # than a soft gate. An exit code INFORMS; whether it blocks is branch
    # protection, which belongs to whoever owns the branch. What DOES fail this
    # job is the tool breaking: an exit code outside the published set means
    # the argv was refused or the process died, which is DEF-123 coming back,
    # and `test -s` means the file the next step uploads actually exists.
    #
    # Only on a push to `main`. `security-events: write` is not granted to a
    # workflow run from a fork's pull request, so running it there would fail
    # for a reason that has nothing to do with this repository.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Read to check the tree out, and write to nothing but the Security tab:
      # the job's whole output is a SARIF upload about this repository.
      contents: read  # the checkout, and nothing more
      security-events: write  # the SARIF upload to this repository's own Security tab
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
          # Two commits, because the subject of `diff` is what changed between
          # them. A shallow clone has one.
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: the two sides of this push
        run: |
          set -euo pipefail
          echo "SEAMARK_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          echo "SEAMARK_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: what this push changed about what the agents here can do
        id: own
        continue-on-error: true
        uses: $/
        with:
          base: ${{ env.SEAMARK_BASE }}
          head: ${{ env.SEAMARK_HEAD }}
          sarif: seamark.sarif
      - name: the run ended in one of the codes the contract publishes
        run: |
          set -euo pipefail
          CODE="$(cat seamark-exit-code.txt)"
          echo "seamark exited $CODE"
          # 0 nothing fired, 1 a rule fired, 3 something could not be resolved.
          # 2 is the argv being refused and anything else is a crash; both are
          # this repository's problem rather than a finding.
          case "$CODE" in
            0|1|3) ;;
            *) echo "exit $CODE is not a finding, it is a break"; exit 1 ;;
          esac
          test -s seamark.sarif
      - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        # Resolved on 2026-09-22 with
        #   gh api repos/github/codeql-action/git/ref/tags/v3 --jq .object.sha
        # and dereferenced to the commit it points at, because `uses:` takes a
        # commit and an annotated tag's sha is the tag object.
        with:
          sarif_file: seamark.sarif
          category: seamark

  workflows:
    name: zizmor over action.yml and the workflows
    # zizmor over this file and over the Action this repository publishes. A
    # security tool whose own workflow is injectable is the worst possible
    # ridicule, and the class of defect it looks for - a `${{ }}` expression
    # pasted into a `run:` block, an unpinned third-party action, a
    # `pull_request_target` with a head checkout - is exactly the class this
    # repository tells other people to care about.
    #
    # Installed in this job and nowhere else. It is not a dependency of the
    # package, not in the `dev` extra, and not something `make all` can go red
    # because of: a tool that inspects supply chains should not acquire one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: zizmor over action.yml and the workflows
        run: |
          set -euo pipefail
          # `zizmor`, not `python -m zizmor`: it is a Rust binary distributed
          # through PyPI, so it installs an executable and no importable module.
          # The first push found that, because it is the one thing about this job
          # that no local run had ever exercised - locally the binary was called
          # by path.
          #
          # Pinned. An unpinned linter turns this gate red for a reason that is
          # not a change to this repository, and a gate that goes red on somebody
          # else's release is a gate people learn to ignore. 1.30.1 is the
          # version whose clean run is quoted in the phase S3 commit.
          python -m pip install --quiet zizmor==1.30.1
          zizmor --persona=auditor --format plain action.yml .github/workflows/

  action:
    name: the published Action, used the way a stranger would
    # The Action, used the way a stranger would use it. BOTH WAYS, since DEF-123.
    #
    # This job used to run `from-dir`/`to-dir` only, on the argument that a job
    # which had to build a repository would be testing the repository it built.
    # The argument was wrong and it cost the launch: a stranger does not pass
    # `from-dir`, a stranger writes `on: pull_request` and passes nothing, and
    # that path builds a DIFFERENT argv - one with a `--` in it. `--sarif` was
    # appended after `"$@"`, so it landed after the separator, argparse read it
    # as two more refs and `diff` exited 2. On every pull request. Always. A job
    # named "used the way a stranger would" was exercising the way a stranger
    # would not, and three real pull requests in point 10 of phase S3 are how
    # that was found.
    #
    # So the refs branch runs here too, over two commits this job makes in its
    # own checkout. That is not testing the repository it built: the repository
    # is the fixture, and what is under test is whether the Action can hand two
    # refs to the tool at all.
    #
    # `continue-on-error` on the step and an explicit `test` on its outcome,
    # rather than `|| true`: the Action's whole contract is that the exit code
    # passes through, so the test has to be able to observe a non-zero one
    # without the job dying before it can.
    #
    # `uses: $/` is GitHub's self-repository syntax, and it is stricter than
    # `uses: ./`: it cannot load an action a previous step cloned at runtime, and
    # it counts as pinning for policy enforcement, which is why zizmor asks for
    # it. It arrives in a commit of its own, after this job had already been
    # green twice with `./`, so a red build here can only be about this one line.
    # That sequencing was the point - the Action and this syntax were both
    # unverified at once, and a build that failed would not have said which.
    # See run 35382239038 for the first green with `./`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: a tree with nothing configured, against itself
        id: clean
        continue-on-error: true
        uses: $/
        with:
          from-dir: tests/fixtures/action/clean
          to-dir: tests/fixtures/action/clean
          sarif: clean.sarif
      - name: keep the clean run's exit code before the second run overwrites it
        if: ${{ always() }}
        run: mv seamark-exit-code.txt clean-exit-code.txt
      - name: the keyv wave arriving on top of it
        id: keyv
        continue-on-error: true
        uses: $/
        with:
          from-dir: tests/fixtures/action/clean
          to-dir: tests/fixtures/surface/keyv-august
          sarif: keyv.sarif
      - name: keep the keyv run's exit code
        if: ${{ always() }}
        run: mv seamark-exit-code.txt keyv-exit-code.txt
      - name: the exit codes are the ones the contract publishes
        # Read from the files the Action writes, not from its outputs. A
        # composite action that failed does not map its outputs, so
        # `steps.keyv.outputs.exit-code` is an empty string in exactly the case
        # this job exists to check. The first push found that too.
        run: |
          set -euo pipefail
          CLEAN="$(cat clean-exit-code.txt)"
          KEYV="$(cat keyv-exit-code.txt)"
          echo "clean=$CLEAN keyv=$KEYV"
          test "$CLEAN" = "0"
          test "$KEYV" = "1"
          test -s clean.sarif
          test -s keyv.sarif
          python -c "
          import json, sys
          clean = json.load(open('clean.sarif'))
          keyv = json.load(open('keyv.sarif'))
          assert clean['version'] == '2.1.0', clean['version']
          assert clean['runs'][0]['results'] == [], 'a clean tree produced a result'
          rules = sorted(r['id'] for r in keyv['runs'][0]['tool']['driver']['rules'])
          assert rules == ['ACT-S001', 'ACT-S003'], rules
          levels = [r['level'] for r in keyv['runs'][0]['results']]
          assert sorted(levels) == ['error', 'warning'], levels
          print('two results, two different levels, neither of them a maximum')
          "
      - name: two commits in this checkout, so the refs branch has refs to read
        run: |
          set -euo pipefail
          git config user.email "ci@example.invalid"
          git config user.name "seamark ci"
          git switch --quiet -c seamark-refs-probe
          git commit --quiet --allow-empty -m "the base side of the refs probe"
          echo "REFS_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "" >> README.md
          echo "probe" >> README.md
          git commit --quiet -am "one line of a file that is not agent configuration"
          echo "REFS_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: the refs branch, which is the one the documentation tells people to use
        id: refs
        continue-on-error: true
        uses: $/
        with:
          base: ${{ env.REFS_BASE }}
          head: ${{ env.REFS_HEAD }}
          sarif: refs.sarif
      - name: the refs run said what a pull request of that shape has to say
        run: |
          set -euo pipefail
          REFS="$(cat seamark-exit-code.txt)"
          echo "refs=$REFS"
          # 0 and not 2. This repository carries agent configuration of its own,
          # in fixtures and in `.claude/`, and it is identical on both sides, so
          # it resolves to unchanged and moves nothing. A 2 here is the argv
          # being refused, which is DEF-123 coming back.
          test "$REFS" = "0"
          test -s refs.sarif
          test -s seamark-diff.txt
          grep -q "Identical on both sides" seamark-diff.txt
