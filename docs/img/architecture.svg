<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 478" width="1000" height="478" role="img" aria-label="How Actaira is put together">
<title>How Actaira is put together</title>
<text x="56" y="38" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E7781" font-weight="600" text-anchor="start">one source, from bytes to a receipt somebody else can check</text>
<rect x="56" y="58" width="888" height="62" rx="10" fill="#7D8590" fill-opacity="0.05" stroke="#7D8590" stroke-opacity="0.55" stroke-dasharray="5 4"/>
<text x="74" y="82" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#7D8590" font-weight="700" text-anchor="start">DISCOVERY</text>
<text x="74" y="102" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#7D8590" font-weight="400" text-anchor="start">7 connectors: a registry, a hub, a directory, a bucket. They enumerate and stage.</text>
<text x="928" y="102" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7D8590" font-weight="400" text-anchor="end">may reach the network</text>
<path d="M56 140 H944" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="7 5" stroke-opacity="0.8"/>
<text x="56" y="134" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8B5CF6" font-weight="600" text-anchor="start">nothing above this line decides anything, and nothing below it opens a socket</text>
<rect x="56" y="168" width="213" height="156" rx="10" fill="#8B5CF6" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.55"/>
<text x="72" y="194" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8B5CF6" font-weight="700" text-anchor="start">READ</text>
<text x="72" y="212" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7D8590" font-weight="400" text-anchor="start">bytes, never loaded</text>
<text x="72" y="238" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">detected by content,</text>
<text x="72" y="255" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">never by file suffix</text>
<text x="72" y="272" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">80 rules over an exact</text>
<text x="72" y="289" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">abstract interpretation</text>
<text x="72" y="306" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">6 surfaces, 4 states</text>
<path d="M271 246.0 H274" stroke="#7D8590" stroke-width="1.6" fill="none" stroke-opacity="0.75"/><path d="m273 242.0 6 4 -6 4Z" fill="#7D8590" fill-opacity="0.75"/>
<rect x="281" y="168" width="213" height="156" rx="10" fill="#8B5CF6" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.55"/>
<text x="297" y="194" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8B5CF6" font-weight="700" text-anchor="start">REMEMBER</text>
<text x="297" y="212" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7D8590" font-weight="400" text-anchor="start">SQLite you own</text>
<text x="297" y="238" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">5 observation states: a</text>
<text x="297" y="255" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">first sighting is not</text>
<text x="297" y="272" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">an unchanged one</text>
<text x="297" y="289" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">5 evidence states, tied</text>
<text x="297" y="306" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">to a digest; 12 relations</text>
<path d="M496 246.0 H499" stroke="#7D8590" stroke-width="1.6" fill="none" stroke-opacity="0.75"/><path d="m498 242.0 6 4 -6 4Z" fill="#7D8590" fill-opacity="0.75"/>
<rect x="506" y="168" width="213" height="156" rx="10" fill="#8B5CF6" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.55"/>
<text x="522" y="194" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8B5CF6" font-weight="700" text-anchor="start">DECIDE</text>
<text x="522" y="212" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7D8590" font-weight="400" text-anchor="start">and say why</text>
<text x="522" y="238" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">21 predicates over</text>
<text x="522" y="255" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">5 kinds of subject</text>
<text x="522" y="272" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">ALLOW / DENY / REVIEW</text>
<text x="522" y="289" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">15 controls, 21 obligations</text>
<text x="522" y="306" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">no information: REVIEW</text>
<path d="M721 246.0 H724" stroke="#7D8590" stroke-width="1.6" fill="none" stroke-opacity="0.75"/><path d="m723 242.0 6 4 -6 4Z" fill="#7D8590" fill-opacity="0.75"/>
<rect x="731" y="168" width="213" height="156" rx="10" fill="#8B5CF6" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.55"/>
<text x="747" y="194" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8B5CF6" font-weight="700" text-anchor="start">PROVE</text>
<text x="747" y="212" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7D8590" font-weight="400" text-anchor="start">offline, to a stranger</text>
<text x="747" y="238" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">RFC 6962 Merkle, with</text>
<text x="747" y="255" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">inclusion and consistency</text>
<text x="747" y="272" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">Ed25519, RFC 3161, DSSE</text>
<text x="747" y="289" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">integrity and identity</text>
<text x="747" y="306" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">answered separately</text>
<rect x="56" y="352" width="888" height="96" rx="10" fill="#7D8590" fill-opacity="0.04" stroke="#7D8590" stroke-opacity="0.55"/>
<text x="74" y="378" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#7D8590" font-weight="700" text-anchor="start">WHAT COMES OUT</text>
<text x="74" y="406" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B5CF6" font-weight="650" text-anchor="start">exit 0</text>
<text x="74" y="424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">nothing objected</text>
<text x="252" y="406" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B5CF6" font-weight="650" text-anchor="start">exit 1</text>
<text x="252" y="424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">a finding, or DENY</text>
<text x="430" y="406" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B5CF6" font-weight="650" text-anchor="start">exit 3</text>
<text x="430" y="424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">inconclusive, or REVIEW</text>
<text x="608" y="406" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B5CF6" font-weight="650" text-anchor="start">SARIF / JUnit</text>
<text x="608" y="424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">for the pipeline</text>
<text x="786" y="406" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B5CF6" font-weight="650" text-anchor="start">receipt</text>
<text x="786" y="424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">verified without this tool</text>
<text x="74" y="444" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7781" font-weight="400" text-anchor="start">exit 3 is separate from 0 on purpose: an artifact the tool could not fully read is never reported as safe.</text>
</svg>
