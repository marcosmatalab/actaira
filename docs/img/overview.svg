<text x="334" y="100" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#6E7781" font-weight="700" text-anchor="start">Actaira</text>
<rect x="298" y="126" width="4" height="22" rx="2" fill="#8B5CF6" fill-opacity="0.55"/>
<text x="312" y="138" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E7781" font-weight="600" text-anchor="start">Static inspection</text>
<text x="312" y="153" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">80 rules, no unpickler</text>
<rect x="298" y="160" width="4" height="22" rx="2" fill="#8B5CF6" fill-opacity="0.55"/>
<text x="312" y="172" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E7781" font-weight="600" text-anchor="start">Agent attack paths</text>
<text x="312" y="187" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">9 capability rules, and the route</text>
<rect x="298" y="194" width="4" height="22" rx="2" fill="#8B5CF6" fill-opacity="0.55"/>
<text x="312" y="206" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E7781" font-weight="600" text-anchor="start">Graph and impact</text>
<text x="312" y="221" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">12 relation kinds, each one declared</text>
<rect x="298" y="228" width="4" height="22" rx="2" fill="#8B5CF6" fill-opacity="0.55"/>
<text x="312" y="240" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E7781" font-weight="600" text-anchor="start">Policy as code</text>
<text x="312" y="255" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">21 predicates, never a score</text>
<rect x="298" y="262" width="4" height="22" rx="2" fill="#8B5CF6" fill-opacity="0.55"/>
<text x="312" y="274" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E7781" font-weight="600" text-anchor="start">EU AI Act evidence</text>
<text x="312" y="289" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">15 controls over 21 obligations</text>
<rect x="298" y="296" width="4" height="22" rx="2" fill="#8B5CF6" fill-opacity="0.55"/>
<text x="312" y="308" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E7781" font-weight="600" text-anchor="start">Evidence lifecycle</text>
<text x="312" y="323" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">5 states, bound to a digest</text>
<rect x="298" y="330" width="4" height="22" rx="2" fill="#8B5CF6" fill-opacity="0.55"/>
<text x="312" y="342" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6E7781" font-weight="600" text-anchor="start">Attestations and receipts</text>
<text x="312" y="357" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">RFC 6962, Ed25519, verified offline</text>
<path d="M724 224.0 H751" stroke="#7D8590" stroke-width="1.6" fill="none" stroke-opacity="0.75"/><path d="m750 220.0 6 4 -6 4Z" fill="#7D8590" fill-opacity="0.75"/>
<rect x="758" y="64" width="186" height="320" rx="10" fill="#8B5CF6" fill-opacity="0.04" stroke="#8B5CF6" stroke-opacity="0.5"/>
<text x="776" y="92" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#7D8590" font-weight="700" text-anchor="start">COMES OUT</text>
<text x="776" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#8B5CF6" font-weight="700" text-anchor="start">ALLOW</text>
<text x="776" y="146" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">nothing objected</text>
<text x="776" y="176" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#8B5CF6" font-weight="700" text-anchor="start">DENY</text>
<text x="776" y="192" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">a finding, or a rule</text>
<text x="776" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#8B5CF6" font-weight="700" text-anchor="start">REVIEW</text>
<text x="776" y="238" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">not enough was read</text>
<text x="776" y="290" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#6E7781" font-weight="600" text-anchor="start">and a signed receipt</text>
<text x="776" y="308" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">somebody with neither</text>
<text x="776" y="322" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">the artifacts nor this</text>
<text x="776" y="336" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">tool can check</text>
</svg>
