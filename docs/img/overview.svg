<text x="74" y="92" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#7D8590" font-weight="700" text-anchor="start">GOES IN</text>
<text x="74" y="114" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D8590" font-weight="400" text-anchor="start">5 kinds of subject</text>
<text x="74" y="148" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#6E7781" font-weight="400" text-anchor="start">artifact</text>
<text x="74" y="174" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#6E7781" font-weight="400" text-anchor="start">bundle</text>
<text x="74" y="200" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#6E7781" font-weight="400" text-anchor="start">agent</text>
<text x="74" y="226" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#6E7781" font-weight="400" text-anchor="start">system</text>
<text x="74" y="252" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#6E7781" font-weight="400" text-anchor="start">source</text>
<text x="74" y="292" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">read as bytes, never</text>
<text x="74" y="306" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7D8590" font-weight="400" text-anchor="start">loaded and never run</text>
