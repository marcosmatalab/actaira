<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 286" width="1000" height="286" role="img" aria-label="The Actaira assurance loop">
<title>The Actaira assurance loop</title>
<text x="500.0" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E7781" font-weight="600" text-anchor="middle">what happens to one source, and what happens next time</text>
